<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novexa Mine</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
        }
        .coin-icon {
            font-size: 80px;
            margin: 20px 0;
        }
        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn-ad {
            background-color: #28a745;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⛏️ Novexa Mine</h2>
        <div class="coin-icon">🪙</div>
        <div class="balance"><span id="balance">0</span> NOVEXA</div>
        
        <p id="status">মাইনিং শুরু করতে নিচে ক্লিক করুন</p>
        <button id="mineBtn" class="btn" onclick="startMining()">Start Mining</button>
        
        <hr style="margin: 25px 0; border-color: #333;">
        
        <h3>📺 Watch Ads to Earn Bonus</h3>
        <!-- Monetag Ad Button -->
        <button class="btn btn-ad" onclick="showMonetagAd()">Watch Ad (+100 NOVEXA)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0;

        function updateBalance(amount) {
            balance += amount;
            document.getElementById('balance').innerText = balance;
        }

        function startMining() {
            document.getElementById('status').innerText = "⛏️ মাইনিং চলছে...";
            document.getElementById('mineBtn').disabled = true;
            
            setTimeout(() => {
                updateBalance(500);
                document.getElementById('status').innerText = "✅ মাইনিং শেষ! ৫০০ NOVEXA যোগ হয়েছে।";
                document.getElementById('mineBtn').disabled = false;
            }, 5000); 
        }

        // Monetag Direct Link Integration
        function showMonetagAd() {
            let monetagLink = "https://omg10.com/4/11858728"; 
            window.open(monetagLink, '_blank');
            updateBalance(100);
        }
    </script>
</body>
</html>
