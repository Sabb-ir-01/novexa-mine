<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Novexa Mine</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: #1a1d2a;
            --accent-gold: #ffc107;
            --text-main: #ffffff;
            --text-sub: #9ea3b5;
            --btn-grad: linear-gradient(135deg, #0088cc, #005588);
            --btn-green: linear-gradient(135deg, #28a745, #1e7e34);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            padding-bottom: 75px;
        }

        /* Top Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #2a2f45;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Balance Display */
        .balance-section {
            text-align: center;
            margin-top: 25px;
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-sub);
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }

        /* Coin Tap Button */
        .tap-area {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        .coin-btn {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe066 0%, #d49500 100%);
            box-shadow: 0 0 35px rgba(255, 193, 7, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 85px;
            cursor: pointer;
            transition: transform 0.08s ease;
            border: 4px solid #fff3c4;
        }

        .coin-btn:active {
            transform: scale(0.92);
        }

        /* Action Cards */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            margin: 0 20px;
            border: 1px solid #2a2f45;
            text-align: center;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--btn-grad);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        .action-btn:disabled {
            background: #2a2f45;
            color: var(--text-sub);
            box-shadow: none;
        }

        .ad-btn {
            background: var(--btn-green);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            padding: 20px;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: var(--card-bg);
            border-top: 1px solid #2a2f45;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 11px;
            cursor: pointer;
            width: 25%;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="header">
        <div class="user-box">
            <div class="avatar" id="avatar">N</div>
            <span id="username" style="font-weight: 600;">Miner</span>
        </div>
        <div style="color: var(--accent-gold); font-weight: 600; font-size: 14px;">
            ⚡ NOVEXA VIP
        </div>
    </div>

    <!-- HOME TAB -->
    <div id="home-tab" class="tab-content active" style="width: 100%;">
        <div class="balance-section">
            <div class="balance-title">TOTAL BALANCE</div>
            <div class="balance-amount">
                🪙 <span id="balance">0</span>
            </div>
        </div>

        <div class="tap-area">
            <div class="coin-btn" onclick="tapCoin()">⛏️</div>
        </div>

        <div class="card" style="width: 85%;">
            <div style="font-size: 13px; color: var(--text-sub);">MINING SESSION (4 HOURS)</div>
            <div id="timer" style="font-size: 22px; font-weight: 700; margin: 8px 0;">Ready</div>
            <button id="mineBtn" class="action-btn" onclick="startMining()">Start Mining</button>
        </div>
    </div>

    <!-- TASKS TAB -->
    <div id="tasks-tab" class="tab-content" style="width: 100%;">
        <h3 style="margin-bottom: 15px;">Earn Extra Coins</h3>
        <div class="card" style="width: 85%; margin-bottom: 15px;">
            <h4>📺 Watch Monetag Sponsored Ad</h4>
            <p style="font-size: 12px; color: var(--text-sub); margin: 5px 0 10px 0;">Earn +100 NOVEXA per view</p>
            <button class="action-btn ad-btn" onclick="showMonetagAd()">Watch Ad (+100)</button>
        </div>
    </div>

    <!-- REFER TAB -->
    <div id="refer-tab" class="tab-content" style="width: 100%;">
        <h3>Invite Friends</h3>
        <p style="color: var(--text-sub); text-align: center; margin: 10px 0 20px 0; font-size: 14px;">
            Get 500 NOVEXA for each friend you invite.
        </p>
        <button class="action-btn" onclick="shareRefLink()">Copy Invite Link</button>
    </div>

    <!-- WALLET TAB -->
    <div id="wallet-tab" class="tab-content" style="width: 100%;">
        <h3>TON Wallet</h3>
        <p style="color: var(--text-sub); text-align: center; margin-top: 15px; font-size: 14px;">
            Wallet connection will be enabled soon.
        </p>
    </div>

    <!-- Bottom Navigation -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('home-tab', this)">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('tasks-tab', this)">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
        </div>
        <div class="nav-item" onclick="switchTab('refer-tab', this)">
            <i class="fa-solid fa-user-group"></i>
            <span>Friends</span>
        </div>
        <div class="nav-item" onclick="switchTab('wallet-tab', this)">
            <i class="fa-solid fa-wallet"></i>
            <span>Wallet</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name || 'Miner';
            document.getElementById('avatar').innerText = (tg.initDataUnsafe.user.first_name || 'N').charAt(0).toUpperCase();
        }

        let balance = parseInt(localStorage.getItem('novexa_bal')) || 0;
        let miningEnd = parseInt(localStorage.getItem('novexa_end')) || 0;

        document.getElementById('balance').innerText = balance.toLocaleString();

        function updateBal(amount) {
            balance += amount;
            document.getElementById('balance').innerText = balance.toLocaleString();
            localStorage.setItem('novexa_bal', balance);
        }

        function tapCoin() {
            updateBal(1);
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (el) el.classList.add('active');
        }

        function startMining() {
            miningEnd = Date.now() + (4 * 60 * 60 * 1000);
            localStorage.setItem('novexa_end', miningEnd);
            checkMiningStatus();
        }

        function checkMiningStatus() {
            const btn = document.getElementById('mineBtn');
            const timer = document.getElementById('timer');

            if (!miningEnd) return;

            btn.disabled = true;

            const interval = setInterval(() => {
                const now = Date.now();
                const diff = miningEnd - now;

                if (diff <= 0) {
                    clearInterval(interval);
                    timer.innerText = "Completed!";
                    btn.disabled = false;
                    btn.innerText = "Claim 500 NOVEXA";
                    btn.onclick = claimReward;
                    localStorage.removeItem('novexa_end');
                } else {
                    let h = Math.floor(diff / (1000 * 60 * 60));
                    let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    let s = Math.floor((diff % (1000 * 60)) / 1000);
                    timer.innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    btn.innerText = "Mining Active...";
                }
            }, 1000);
        }

        function claimReward() {
            updateBal(500);
            document.getElementById('timer').innerText = "Ready";
            const btn = document.getElementById('mineBtn');
            btn.innerText = "Start Mining";
            btn.onclick = startMining;
        }

        if (miningEnd && miningEnd > Date.now()) {
            checkMiningStatus();
        }

        // TELEGRAM MONETAG AD OPENER (FIXED)
        function showMonetagAd() {
            let adLink = "https://omg10.com/4/11858728";
            if (tg.openLink) {
                tg.openLink(adLink);
            } else {
                window.open(adLink, '_blank');
            }
            updateBal(100);
        }

        function shareRefLink() {
            let inviteLink = "https://t.me/NovexaMineBot?start=ref";
            navigator.clipboard.writeText(inviteLink);
            alert("Invite link copied!");
        }
    </script>
</body>
</html>
